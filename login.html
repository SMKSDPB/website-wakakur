
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Login - Website Wakakur</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }
    .login-box h1 {
      color: #901518;
      margin-bottom: 8px;
    }
    .login-box label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .login-box button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #901518;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .login-box button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    #loginMessage {
      margin-top: 15px;
      font-size: 14px;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Login Website Wakakur</h1>
    <p>Masuk menggunakan akun yang telah diberikan sekolah.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" id="loginButton">Masuk</button>
      <p id="loginMessage" role="status"></p>
    </form>

    <a class="back-link" href="index.html">Kembali ke halaman utama</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
